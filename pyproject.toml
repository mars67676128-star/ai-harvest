[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-harvest"
version = "0.1.0"
description = "Portable, governed expert capabilities for real-estate operations"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "starlette>=0.46,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.package-data]
harvest = ["migrations/*.sql", "prompts/*.txt"]

[tool.setuptools.packages.find]
include = ["harvest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
